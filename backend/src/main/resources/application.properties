spring.application.name=backend

# db source
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/careerfit?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

#파일 저장 로직
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# mybatis-config
mybatis.mapper-locations=classpath:/mappers/*.xml
mybatis.type-aliases-package=com.peach.careerfit.*.model.dto
mybatis.configuration.map-underscore-to-camel-case=true

spring.jwt.secret=vmfhaltmskdlsgodyserdkfelsekdfeswredesdfesaeweasdawdgfgae

# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#email
